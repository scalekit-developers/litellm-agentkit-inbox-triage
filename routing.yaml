# Model assignments per pipeline stage.
# Model names must match what llm.scalekit.cloud advertises.
# Run: curl -H "Authorization: Bearer $LITELLM_API_KEY" $LITELLM_BASE_URL/v1/models
models:
  classify: claude-haiku-4-5
  research: claude-haiku-4-5
  tiebreak: claude-sonnet-4-6
  draft_default: claude-sonnet-4-6
  draft_sensitive: claude-opus-4-6   # used when category is security or legal

# Repository routing: each repo maps keywords to labels and a Slack channel.
# Keyword matching is case-insensitive substring search against
# the combined subject + body of the classified thread.
# For Slack DMs: set slack_channel to your Slack member ID (e.g. U0123456789)
repos:
  - name: saif-shines/hacksmith
    keywords: [bug, error, crash, feature, request, issue, help, support]
    labels: [triage]
    slack_channel: "D09MNBXG7NK"

# Fallback when no repo keyword matches
default:
  name: saif-shines/hacksmith
  labels: [needs-triage]
  slack_channel: "D09MNBXG7NK"
