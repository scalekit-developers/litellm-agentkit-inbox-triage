<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inbox Triage Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f5f5; color: #111; }
    header { background: #0f172a; color: #fff; padding: 1rem 2rem; display: flex; align-items: center; gap: 1rem; }
    header h1 { font-size: 1.1rem; font-weight: 600; }
    header span { font-size: 0.8rem; opacity: 0.6; }
    main { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    #status { margin-bottom: 1rem; font-size: 0.85rem; color: #555; }
    .proposal { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 1.25rem; margin-bottom: 1.25rem; }
    .proposal-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; }
    .proposal-subject { font-weight: 600; font-size: 1rem; }
    .badges { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .badge { padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; }
    .badge-critical { background: #fee2e2; color: #991b1b; }
    .badge-high     { background: #ffedd5; color: #92400e; }
    .badge-medium   { background: #fef9c3; color: #713f12; }
    .badge-low      { background: #dcfce7; color: #166534; }
    .badge-category { background: #ede9fe; color: #4c1d95; }
    .meta { margin-top: 0.5rem; font-size: 0.8rem; color: #64748b; }
    .section { margin-top: 0.9rem; }
    .section-label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #94a3b8; margin-bottom: 0.3rem; }
    .section-content { font-size: 0.85rem; line-height: 1.5; white-space: pre-wrap; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 4px; padding: 0.6rem 0.75rem; max-height: 120px; overflow-y: auto; }
    .related-issues { list-style: none; }
    .related-issues li { font-size: 0.82rem; margin-bottom: 0.2rem; }
    .related-issues a { color: #2563eb; text-decoration: none; }
    .actions { margin-top: 1rem; }
    .action-options { display: flex; gap: 1.25rem; margin-bottom: 0.65rem; }
    .action-options label { display: flex; align-items: center; gap: 0.35rem; font-size: 0.82rem; color: #475569; cursor: pointer; }
    .action-buttons { display: flex; gap: 0.75rem; }
    button { padding: 0.5rem 1.1rem; border-radius: 6px; font-size: 0.85rem; font-weight: 600; cursor: pointer; border: none; transition: opacity 0.15s; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-approve { background: #16a34a; color: #fff; }
    .btn-approve:hover:not(:disabled) { background: #15803d; }
    .btn-reject  { background: #fff; color: #dc2626; border: 1px solid #dc2626; }
    .btn-reject:hover:not(:disabled) { background: #fef2f2; }
    .info-callout { margin-top: 0.5rem; padding: 0.5rem 0.75rem; background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 4px; font-size: 0.78rem; color: #1e40af; line-height: 1.5; }
    .info-callout a { color: #1d4ed8; }
    .info-callout code { background: #dbeafe; padding: 0.1em 0.3em; border-radius: 3px; font-size: 0.9em; }
    .result-link { font-size: 0.82rem; margin-top: 0.5rem; }
    .result-link a { color: #2563eb; }
    .empty { text-align: center; color: #94a3b8; padding: 4rem 0; }
  </style>
</head>
<body>
  <header>
    <h1>Inbox Triage Dashboard</h1>
    <span id="last-refresh">Loading…</span>
  </header>
  <main>
    <div id="status"></div>
    <div id="proposals"></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
